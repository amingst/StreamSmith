<!DOCTYPE html>
<html>
<head>
	<meta charset="utf-8" />
	<title>StreamSmith</title>
	<style>
		:root {
			color-scheme: dark;
			--bg: #2d2d2d;
			--fg: #d8d8d8;
			--muted: #969696;
			--line: #3d3d3d;
			--accent: #3b82f6;
		}
		body {
			margin: 0;
			padding: 12px;
			background: var(--bg);
			color: var(--fg);
			font: 13px/1.5 "Segoe UI", system-ui, sans-serif;
		}
		.row {
			display: flex;
			align-items: center;
			gap: 8px;
			margin-bottom: 10px;
		}
		.row label {
			flex: 0 0 86px;
			color: var(--muted);
			text-align: right;
		}
		select, input {
			flex: 1 1 auto;
			min-width: 0;
			padding: 4px 6px;
			background: #3d3d3d;
			color: var(--fg);
			border: 1px solid var(--line);
			border-radius: 3px;
		}
		select:disabled, input:disabled { opacity: 0.5; }
		.note {
			margin-top: 10px;
			padding-top: 10px;
			border-top: 1px solid var(--line);
			color: var(--muted);
		}
		.note.offline { color: #f0a500; }
		.hidden { display: none; }
	</style>
</head>
<body>
	<div class="row" id="row-scene">
		<label for="scene">Scene</label>
		<select id="scene"></select>
	</div>

	<div class="row" id="row-source">
		<label for="source">Source</label>
		<select id="source"></select>
	</div>

	<div class="row" id="row-step">
		<label for="step">Step</label>
		<input type="number" id="step" min="1" max="50" step="1" /> <span>%</span>
	</div>

	<div class="row" id="row-direction">
		<label for="direction">Direction</label>
		<select id="direction">
			<option value="up">Volume up</option>
			<option value="down">Volume down</option>
		</select>
	</div>

	<div class="row">
		<label for="port">App port</label>
		<input type="number" id="port" min="1" max="65535" />
	</div>

	<div class="note" id="note"></div>

	<script src="inspector.js"></script>
</body>
</html>
